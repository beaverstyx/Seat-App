name: Auto-shuffle seating

on:
  schedule:
    # Every 10 minutes from 07:00 to 10:59 Japan time (22:00-01:59 UTC).
    # The script itself checks the class days/times and skips if a shuffle already happened.
    - cron: '*/10 22,23,0,1 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Shuffle all classes now, ignoring the schedule (type yes)'
        required: false
        default: ''

jobs:
  shuffle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-audit --no-fund firebase-admin@12
      - name: Run auto-shuffle
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          if [ "$FORCE" = "yes" ]; then node scripts/auto-shuffle.js --force; else node scripts/auto-shuffle.js; fi
