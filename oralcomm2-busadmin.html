<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SeatCheck — Oral Comm II (Business Admin)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root{
    --ink: #12213E;
    --ink-2: #1C2E52;
    --ink-3: #263B66;
    --paper: #FBF6EB;
    --stub: #E4DAC2;
    --amber: #E8A33D;
    --green: #3F8F6A;
    --coral: #C1553D;
    --line: rgba(251,246,235,0.14);
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'IBM Plex Sans', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--ink);
    color: var(--paper);
    font-family: var(--font-body);
    min-height: 100vh;
  }
  button{ font-family: inherit; }
  ::selection{ background: var(--amber); color: var(--ink); }

  :focus-visible{
    outline: 2px solid var(--amber);
    outline-offset: 2px;
  }

  .app-shell{
    max-width: 840px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Topbar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 18px 20px;
    border-bottom: 1px solid var(--line);
  }
  .brand{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 20px;
    letter-spacing: 0.02em;
    display:flex;
    align-items:center;
    gap: 8px;
  }
  .brand .tag{
    color: var(--amber);
  }
  .brand .flight{
    font-family: var(--font-mono);
    font-size: 11px;
    color: rgba(251,246,235,0.5);
    font-weight: 500;
    letter-spacing: 0.08em;
    margin-left: 4px;
  }
  .mode-btn{
    background: transparent;
    border: 1px solid rgba(251,246,235,0.3);
    color: var(--paper);
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .mode-btn:hover{ border-color: var(--amber); background: rgba(232,163,61,0.08); }

  main{ flex:1; padding: 28px 20px 60px; }

  /* ---------- shared bits ---------- */
  .eyebrow{
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--amber);
    margin: 0 0 6px;
  }
  h1{ font-family: var(--font-display); font-size: 26px; margin: 0 0 4px; }
  .sub{ color: rgba(251,246,235,0.6); font-size: 14px; margin: 0 0 24px; }

  /* ================= STUDENT VIEW ================= */
  .lookup-box{
    background: var(--ink-2);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 22px;
  }
  .lookup-box input{
    width: 100%;
    background: var(--ink);
    border: 1px solid rgba(251,246,235,0.25);
    color: var(--paper);
    font-family: var(--font-mono);
    font-size: 16px;
    padding: 12px 14px;
    border-radius: 8px;
  }
  .lookup-box input::placeholder{ color: rgba(251,246,235,0.35); }
  .match-list{ margin-top: 10px; display:flex; flex-direction:column; gap:6px; }
  .match-item{
    text-align:left;
    background: var(--ink);
    border: 1px solid var(--line);
    color: var(--paper);
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
  }
  .match-item:hover{ border-color: var(--amber); }

  .empty-note{
    font-family: var(--font-mono);
    font-size: 12.5px;
    color: rgba(251,246,235,0.55);
    letter-spacing: 0.03em;
    padding: 10px 2px 2px;
  }

  /* Boarding pass */
  .ticket-wrap{ display:flex; justify-content:center; padding: 8px 0 6px; }
  .ticket{
    width: 100%;
    max-width: 380px;
    background: var(--paper);
    color: var(--ink);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 18px 40px rgba(0,0,0,0.35);
    animation: ticketIn 0.5s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes ticketIn{
    from{ opacity:0; transform: translateY(14px) scale(0.98); }
    to{ opacity:1; transform: translateY(0) scale(1); }
  }
  .ticket-top{ padding: 20px 22px 16px; }
  .ticket-top .eyebrow{ color: var(--coral); }
  .ticket-name{ font-family: var(--font-display); font-size: 22px; font-weight:700; margin: 0; }
  .ticket-course{ font-size: 13px; color: rgba(18,33,62,0.6); margin-top: 2px; }

  .ticket-perf{
    height: 0;
    border-top: 2px dashed rgba(18,33,62,0.25);
    position: relative;
    margin: 0 0;
  }
  .ticket-perf::before, .ticket-perf::after{
    content:"";
    position:absolute;
    top:-11px;
    width:22px; height:22px;
    background: var(--ink);
    border-radius:50%;
  }
  .ticket-perf::before{ left:-11px; }
  .ticket-perf::after{ right:-11px; }

  .ticket-bottom{
    display:flex;
    padding: 18px 22px 22px;
    gap: 18px;
    align-items:center;
  }
  .seat-code{
    font-family: var(--font-mono);
    font-size: 40px;
    font-weight: 600;
    background: var(--ink);
    color: var(--amber);
    padding: 10px 16px;
    border-radius: 10px;
    letter-spacing: 0.02em;
  }
  .ticket-meta{ font-size: 12.5px; line-height:1.6; }
  .ticket-meta .k{ color: rgba(18,33,62,0.5); font-family: var(--font-mono); font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase; }

  .room-card{
    margin-top: 18px;
    background: var(--ink-2);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px 16px 16px;
  }
  .front-marker{
    text-align:center;
    font-family: var(--font-mono);
    font-size: 9.5px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(251,246,235,0.4);
    border-bottom: 1px solid rgba(251,246,235,0.15);
    padding-bottom: 8px;
    margin-bottom: 14px;
  }
  .mini-map{
    display:grid;
    gap: 6px;
    justify-content:center;
  }
  .mini-cell{
    width: 20px; height:20px;
    border-radius: 4px;
    background: rgba(251,246,235,0.22);
    border: 1px solid rgba(251,246,235,0.14);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: var(--font-mono);
    font-size: 12px;
    line-height:1;
  }
  .mini-cell.gap{
    background: rgba(193,85,61,0.14);
    border: 1px dashed rgba(193,85,61,0.6);
    color: #E9A18F;
    font-weight: 600;
  }
  .mini-cell.mine{
    background: var(--amber);
    border-color: var(--amber);
    box-shadow: 0 0 0 3px rgba(232,163,61,0.3);
  }
  .mini-map-label{ text-align:center; font-family: var(--font-mono); font-size:10.5px; letter-spacing:0.1em; color: rgba(251,246,235,0.4); margin-top:12px; text-transform:uppercase; }

  /* Group zone diagram */
  .zone-grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .zone-box{
    background: rgba(251,246,235,0.06);
    border: 1px solid rgba(251,246,235,0.18);
    border-radius: 10px;
    padding: 10px 10px;
    min-height: 60px;
  }
  .zone-box.mine{
    border-color: var(--amber);
    background: rgba(232,163,61,0.1);
    box-shadow: 0 0 0 2px rgba(232,163,61,0.3);
  }
  .zone-label{
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.06em;
    color: var(--amber);
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .zone-members{
    font-size: 11.5px;
    line-height: 1.5;
    color: rgba(251,246,235,0.75);
  }
  .zone-members.on-paper{ color: rgba(18,33,62,0.7); }
  .zone-label.on-paper{ color: var(--coral); }

  /* ================= TEACHER VIEW ================= */
  .pin-box{
    background: var(--ink-2);
    border:1px solid var(--line);
    border-radius: 14px;
    padding: 22px;
    max-width: 320px;
  }
  .pin-box input{
    width:100%;
    background: var(--ink);
    border:1px solid rgba(251,246,235,0.25);
    color: var(--paper);
    font-family: var(--font-mono);
    font-size: 18px;
    letter-spacing: 0.3em;
    padding: 10px 12px;
    border-radius: 8px;
    margin: 12px 0;
    text-align:center;
  }
  .primary-btn{
    background: var(--amber);
    color: var(--ink);
    border:none;
    font-weight:600;
    padding: 10px 16px;
    border-radius: 8px;
    cursor:pointer;
    font-size: 14px;
  }
  .primary-btn:hover{ filter: brightness(1.08); }
  .ghost-btn{
    background: transparent;
    border: 1px solid rgba(251,246,235,0.3);
    color: var(--paper);
    padding: 10px 16px;
    border-radius: 8px;
    cursor:pointer;
    font-size: 14px;
  }
  .ghost-btn:hover{ border-color: var(--amber); }
  .danger-btn{
    background: transparent;
    border: 1px solid rgba(193,85,61,0.5);
    color: #E9A18F;
    padding: 10px 16px;
    border-radius: 8px;
    cursor:pointer;
    font-size: 13px;
  }
  .danger-btn:hover{ border-color: var(--coral); background: rgba(193,85,61,0.1); }
  .error-text{ color: #E9A18F; font-family: var(--font-mono); font-size: 12.5px; min-height: 16px; }

  .panel{
    background: var(--ink-2);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .panel h2{
    font-family: var(--font-display);
    font-size: 15px;
    margin: 0 0 4px;
    letter-spacing: 0.02em;
  }
  .panel .desc{ font-size:12.5px; color: rgba(251,246,235,0.5); margin: 0 0 14px; }

  .row-flex{ display:flex; gap: 10px; flex-wrap:wrap; align-items:center; }
  .dim-field{ display:flex; flex-direction:column; gap:4px; }
  .dim-field label{ font-family: var(--font-mono); font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase; color: rgba(251,246,235,0.5); }
  .dim-field input{
    width: 70px;
    background: var(--ink);
    border: 1px solid rgba(251,246,235,0.25);
    color: var(--paper);
    font-family: var(--font-mono);
    font-size: 15px;
    padding: 8px 10px;
    border-radius: 6px;
    text-align:center;
  }

  textarea.roster-input{
    width:100%;
    min-height: 110px;
    background: var(--ink);
    border: 1px solid rgba(251,246,235,0.25);
    color: var(--paper);
    font-family: var(--font-mono);
    font-size: 13.5px;
    padding: 12px;
    border-radius: 8px;
    resize: vertical;
    line-height:1.6;
  }

  .status-line{
    font-family: var(--font-mono);
    font-size: 12px;
    color: rgba(251,246,235,0.6);
    margin-top: 10px;
  }
  .status-line b{ color: var(--amber); }

  /* Departure-board seat grid */
  .board-hint{
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: rgba(251,246,235,0.45);
    margin-bottom: 12px;
  }
  .board{
    display:grid;
    gap: 8px;
    justify-content:start;
    overflow-x: auto;
    padding-bottom: 4px;
    -webkit-overflow-scrolling: touch;
  }
  .flap{
    position: relative;
    width: 68px;
    height: 58px;
    border-radius: 6px;
    background: var(--ink);
    border: 1px solid rgba(251,246,235,0.18);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    padding: 3px;
    transition: transform 0.12s, border-color 0.12s;
    perspective: 300px;
  }
  .flap:hover{ border-color: var(--amber); }
  .flap.gap{
    background: rgba(193,85,61,0.1);
    border: 1px dashed rgba(193,85,61,0.5);
    cursor: pointer;
  }
  .flap.gap:hover{ border-color: rgba(193,85,61,0.8); }
  .flap.assigned{ background: var(--ink-3); border-color: rgba(63,143,106,0.5); }
  .flap-code{
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--amber);
    letter-spacing: 0.06em;
  }
  .flap.gap .flap-code{ color: #E9A18F; font-weight:600; font-size:13px; }
  .flap-name{
    font-size: 10.5px;
    line-height: 1.15;
    text-align:center;
    margin-top: 2px;
    word-break: break-word;
    max-width: 60px;
  }
  .flap.flip .flap-inner{ animation: flipFlap 0.16s ease-in-out; }
  @keyframes flipFlap{
    0%{ transform: rotateX(0deg); }
    50%{ transform: rotateX(90deg); }
    100%{ transform: rotateX(0deg); }
  }
  @media (prefers-reduced-motion: reduce){
    .flap.flip .flap-inner{ animation: none; }
    .ticket{ animation: none; }
  }

  .assign-pop{
    position: fixed;
    background: var(--paper);
    color: var(--ink);
    border-radius: 10px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.4);
    padding: 10px;
    z-index: 50;
    width: 220px;
    max-height: 260px;
    overflow-y:auto;
  }
  .assign-pop .pop-title{
    font-family: var(--font-mono);
    font-size: 10.5px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color: rgba(18,33,62,0.55);
    margin-bottom:8px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .assign-pop .pop-close{ cursor:pointer; background:none; border:none; font-size:14px; color: rgba(18,33,62,0.5); }
  .pop-option{
    display:block;
    width:100%;
    text-align:left;
    background: transparent;
    border: none;
    border-radius: 6px;
    padding: 8px 8px;
    font-size: 13.5px;
    cursor:pointer;
    color: var(--ink);
  }
  .pop-option:hover{ background: rgba(18,33,62,0.08); }
  .pop-option.clear{ color: var(--coral); }
  .pop-empty{ font-size: 12.5px; color: rgba(18,33,62,0.5); padding: 6px 8px; }

  .actions-row{ display:flex; gap:10px; flex-wrap:wrap; margin-top: 16px; }

  .toast{
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-mono);
    font-size: 13px;
    padding: 10px 18px;
    border-radius: 999px;
    box-shadow: 0 10px 24px rgba(0,0,0,0.35);
    opacity: 0;
    pointer-events:none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 60;
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(-4px); }

  @media (max-width: 480px){
    .flap{ width: 54px; height: 50px; }
    .flap-name{ font-size:9px; max-width:46px; }
    .seat-code{ font-size: 32px; }
  }
</style>
</head>
<body>

<div class="app-shell">
  <header class="topbar">
    <div class="brand">✈ SEAT<span class="tag">CHECK</span><span class="flight" id="flightTag"></span></div>
    <button class="mode-btn" id="modeToggleBtn">Teacher setup</button>
  </header>
  <main id="view"></main>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const TEACHER_PIN = "2468"; // prototype-only soft gate, not real security

  const view = document.getElementById('view');
  const modeToggleBtn = document.getElementById('modeToggleBtn');
  const flightTag = document.getElementById('flightTag');
  const toastEl = document.getElementById('toast');

  let mode = 'student'; // 'student' | 'teacher'
  let teacherUnlocked = false;

  let state = {
    rows: 6,
    cols: 9,
    seatEnabled: {"A1":false,"A2":false,"A3":true,"A4":true,"A5":true,"A6":true,"A7":true,"A8":true,"A9":false,"B1":false,"B2":false,"B3":true,"B4":true,"B5":true,"B6":true,"B7":true,"B8":true,"B9":false,"C1":false,"C2":false,"C3":true,"C4":true,"C5":true,"C6":true,"C7":true,"C8":true,"C9":false,"D1":false,"D2":false,"D3":true,"D4":true,"D5":true,"D6":true,"D7":true,"D8":true,"D9":false,"E1":false,"E2":false,"E3":true,"E4":true,"E5":true,"E6":true,"E7":true,"E8":true,"E9":false,"F1":false,"F2":false,"F3":true,"F4":true,"F5":true,"F6":true,"F7":true,"F8":true,"F9":false},
    roster: ["ARIZONO Keita","ARIMURA Yuri","UEDA Haruya","UCHIDA Koichi","KAKITA Yuto","KANAYA Mei","KAWASHIMA Ayame","KIKUKAWA Ryunosuke","KIYOYAMA Asahi","SAIKUSA Kurumi","SAIKUSA Kokomi","SAKAE Ryotaro","SAKAMOTO Haruma","SATO Kota","SHIMOAKA Ryusei","SUGI Wakako","SUGIMORI Hina","TAKAHASHI Mio","TAKEMOTO Harutaro","TACHIYAMA Shinya","TANAKA Koichiro","TANIGUCHI Keita","TSUTSUMI Rento","NAGATANI Mirai","NISHIMURA Yura","HAZURU Aito","HARA Shunta","HARAGUCHI Mei","HIGASHI Uta","HORI Shinnosuke","MIYAHARA Momoko","YAMAGUCHI Takuma","YAMASHITA Toshiharu","YOSHIOKA Hideo","YOSHIDA Tomoka"],
    assignments: {"D5":"ARIZONO Keita","C3":"ARIMURA Yuri","A4":"UEDA Haruya","A3":"UCHIDA Koichi","B3":"KAKITA Yuto","E8":"KANAYA Mei","E3":"KAWASHIMA Ayame","F4":"KIKUKAWA Ryunosuke","F3":"KIYOYAMA Asahi","B6":"SAIKUSA Kurumi","F5":"SAIKUSA Kokomi","B8":"SAKAE Ryotaro","D4":"SAKAMOTO Haruma","C5":"SATO Kota","C7":"SHIMOAKA Ryusei","C6":"SUGI Wakako","F8":"SUGIMORI Hina","B4":"TAKAHASHI Mio","E6":"TAKEMOTO Harutaro","F6":"TACHIYAMA Shinya","D8":"TANAKA Koichiro","A8":"TANIGUCHI Keita","A5":"TSUTSUMI Rento","A7":"NAGATANI Mirai","B5":"NISHIMURA Yura","E7":"HAZURU Aito","D3":"HARA Shunta","C4":"HARAGUCHI Mei","A6":"HIGASHI Uta","D7":"HORI Shinnosuke","C8":"MIYAHARA Momoko","B7":"YAMAGUCHI Takuma","E4":"YAMASHITA Toshiharu","F7":"YOSHIOKA Hideo","D6":"YOSHIDA Tomoka"},
    updatedAt: null,
    classDate: "2026-10-01",
    classTime: "Mon/Thu Period 2 · 10:40–12:10",
    assignMode: "seats",
    numGroups: 8,
    groupAssignments: {}
  };

  let storageAvailable = (typeof window.storage !== 'undefined' && window.storage !== null);

  function storageBannerHtml(){
    if(storageAvailable) return '';
    return `<div style="background:#4a2330;border:1px solid rgba(193,85,61,0.6);color:#F3D9D0;font-family:var(--font-mono);font-size:12px;padding:10px 14px;border-radius:8px;margin-bottom:16px;">
      ⚠ Storage isn't available in this view — changes here won't save or reach other devices. Try re-opening the file link from the chat.
    </div>`;
  }

  function rowLetter(i){ return String.fromCharCode(65 + i); }
  function seatKey(r, c){ return rowLetter(r) + (c + 1); }

  function allSeatKeys(){
    const keys = [];
    for(let r=0; r<state.rows; r++){
      for(let c=0; c<state.cols; c++){
        keys.push(seatKey(r,c));
      }
    }
    return keys;
  }

  function isEnabled(key){
    return state.seatEnabled[key] !== false; // default true
  }

  function ensureSeatDefaults(){
    allSeatKeys().forEach(k => {
      if(!(k in state.seatEnabled)) state.seatEnabled[k] = true;
    });
  }

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(()=> toastEl.classList.remove('show'), 1800);
  }

  function shuffleArray(arr){
    for(let i = arr.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i+1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function shuffleGroups(){
    const names = shuffleArray([...state.roster]);
    const groups = {};
    for(let g = 1; g <= state.numGroups; g++) groups[g] = [];
    names.forEach((name, i) => {
      const groupNum = (i % state.numGroups) + 1;
      groups[groupNum].push(name);
    });
    state.groupAssignments = groups;
  }

  function findStudentGroup(name){
    for(const g of Object.keys(state.groupAssignments)){
      if(state.groupAssignments[g].includes(name)) return g;
    }
    return null;
  }

  // ---------- Storage ----------
  let lastStorageError = null;

  async function loadState(){
    if(!storageAvailable){ lastStorageError = 'window.storage is not available in this view.'; ensureSeatDefaults(); return; }
    try{
      const result = await window.storage.get('seatcheck-config', true);
      if(result && result.value){
        const parsed = JSON.parse(result.value);
        state = Object.assign(state, parsed);
      }
      lastStorageError = null;
    }catch(e){
      // Accessing a key that has never been saved also throws — that's expected
      // the very first time. Keep the message anyway so real failures are visible.
      lastStorageError = (e && e.message) ? e.message : String(e);
    }
    ensureSeatDefaults();
  }

  async function saveState(){
    if(!storageAvailable){ lastStorageError = 'window.storage is not available in this view.'; return false; }
    state.updatedAt = new Date().toISOString();
    try{
      const result = await window.storage.set('seatcheck-config', JSON.stringify(state), true);
      if(!result){
        lastStorageError = 'Storage returned no result — the write may not have been accepted.';
        return false;
      }
      lastStorageError = null;
      return true;
    }catch(e){
      lastStorageError = (e && e.message) ? e.message : String(e);
      console.error('Save failed', e);
      return false;
    }
  }

  // ---------- Rendering: routing ----------
  function render(){
    if(mode === 'student'){
      modeToggleBtn.textContent = 'Teacher setup';
      renderStudentView();
    } else {
      modeToggleBtn.textContent = 'Back to seat check';
      if(!teacherUnlocked){
        renderPinGate();
      } else {
        renderTeacherView();
      }
    }
    flightTag.textContent = state.updatedAt
      ? ('UPD ' + new Date(state.updatedAt).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}))
      : '';
  }

  modeToggleBtn.addEventListener('click', () => {
    mode = (mode === 'student') ? 'teacher' : 'student';
    render();
  });

  // ---------- Student view ----------
  let studentQuery = '';

  function renderStudentView(){
    const hasAnySeat = state.assignMode === 'groups'
      ? Object.values(state.groupAssignments).flat().length > 0
      : Object.keys(state.assignments).length > 0;

    view.innerHTML = `
      <p class="eyebrow">Before you sit down</p>
      <h1>Find your seat</h1>
      <p class="sub">Type your name to check today's seating.</p>

      <div class="lookup-box">
        <input type="text" id="nameSearch" placeholder="Start typing your name..." autocomplete="off" value="${escapeHtml(studentQuery)}" />
        <div class="match-list" id="matchList"></div>
      </div>

      <div id="resultArea"></div>
    `;

    const searchInput = document.getElementById('nameSearch');

    searchInput.addEventListener('input', () => {
      studentQuery = searchInput.value;
      refreshStudentResults();
    });

    if(!hasAnySeat && studentQuery.trim().length === 0){
      document.getElementById('resultArea').innerHTML = `<p class="empty-note">NO SEATING PUBLISHED YET — CHECK BACK CLOSER TO CLASS TIME</p>`;
    } else {
      refreshStudentResults();
    }
  }

  // Recomputes and updates only the match list / ticket, without touching
  // the search input element itself — safe to call from background polling.
  function refreshStudentResults(){
    const matchList = document.getElementById('matchList');
    const resultArea = document.getElementById('resultArea');
    if(!matchList || !resultArea) return; // student shell not mounted right now

    const isGroupMode = state.assignMode === 'groups';
    const placedNames = isGroupMode
      ? Object.values(state.groupAssignments).flat()
      : Object.values(state.assignments);

    const q = studentQuery.trim().toLowerCase();
    matchList.innerHTML = '';
    resultArea.innerHTML = '';
    if(q.length === 0){
      if(placedNames.length === 0){
        resultArea.innerHTML = `<p class="empty-note">NO SEATING PUBLISHED YET — CHECK BACK CLOSER TO CLASS TIME</p>`;
      }
      return;
    }

    const matches = placedNames.filter(n => n.toLowerCase().includes(q));

    if(matches.length === 0){
      resultArea.innerHTML = `<p class="empty-note">NO STUDENT FOUND WITH THAT NAME YET</p>`;
      return;
    }
    if(matches.length === 1 || matches.some(m => m.toLowerCase() === q)){
      const exact = matches.find(m => m.toLowerCase() === q) || matches[0];
      showTicket(exact);
      return;
    }
    matches.slice(0, 8).forEach(name => {
      const btn = document.createElement('button');
      btn.className = 'match-item';
      btn.textContent = name;
      btn.addEventListener('click', () => {
        studentQuery = name;
        const input = document.getElementById('nameSearch');
        if(input) input.value = name;
        matchList.innerHTML = '';
        showTicket(name);
      });
      matchList.appendChild(btn);
    });

    function sessionLineHtml(){
      const parts = [state.classDate, state.classTime].filter(Boolean);
      return parts.length ? `<p class="ticket-course">${escapeHtml(parts.join(' &middot; '))}</p>` : '';
    }

    function showTicket(name){
      if(isGroupMode){
        showGroupTicket(name);
      } else {
        showSeatTicket(name);
      }
    }

    function showSeatTicket(name){
      const entry = Object.entries(state.assignments).find(([k,v]) => v === name);
      if(!entry){ resultArea.innerHTML = `<p class="empty-note">SEAT NOT FOUND</p>`; return; }
      const [key] = entry;
      const rowIdx = key.charCodeAt(0) - 65;
      const colIdx = parseInt(key.slice(1), 10) - 1;

      resultArea.innerHTML = `
        <div class="ticket-wrap">
          <div class="ticket">
            <div class="ticket-top">
              <p class="eyebrow" style="margin-bottom:6px;">Boarding confirmed</p>
              <p class="ticket-name">${escapeHtml(name)}</p>
              <p class="ticket-course">Row ${rowLetter(rowIdx)} &middot; Seat ${colIdx+1}</p>
              ${sessionLineHtml()}
            </div>
            <div class="ticket-perf"></div>
            <div class="ticket-bottom">
              <div class="seat-code">${key}</div>
              <div class="ticket-meta">
                <div class="k">Take your seat at</div>
                <div>${key}</div>
              </div>
            </div>
          </div>
        </div>
        <div class="room-card">
          <div class="front-marker">↑ Front of room</div>
          <div class="mini-map" id="miniMap" style="grid-template-columns: repeat(${state.cols}, 20px);"></div>
        </div>
        <p class="mini-map-label">Room layout &middot; your seat highlighted</p>
      `;

      const miniMap = document.getElementById('miniMap');
      for(let r=0; r<state.rows; r++){
        for(let c=0; c<state.cols; c++){
          const k = seatKey(r,c);
          const cell = document.createElement('div');
          if(!isEnabled(k)){
            cell.className = 'mini-cell gap';
            cell.textContent = '×';
          } else if(k === key){
            cell.className = 'mini-cell mine';
          } else {
            cell.className = 'mini-cell';
          }
          miniMap.appendChild(cell);
        }
      }
    }

    function showGroupTicket(name){
      const groupNum = findStudentGroup(name);
      if(!groupNum){ resultArea.innerHTML = `<p class="empty-note">GROUP NOT FOUND</p>`; return; }
      const members = state.groupAssignments[groupNum];
      const others = members.filter(m => m !== name);

      resultArea.innerHTML = `
        <div class="ticket-wrap">
          <div class="ticket">
            <div class="ticket-top">
              <p class="eyebrow" style="margin-bottom:6px;">Boarding confirmed</p>
              <p class="ticket-name">${escapeHtml(name)}</p>
              <p class="ticket-course">Group ${groupNum} of ${state.numGroups}</p>
              ${sessionLineHtml()}
            </div>
            <div class="ticket-perf"></div>
            <div class="ticket-bottom">
              <div class="seat-code">G${groupNum}</div>
              <div class="ticket-meta">
                <div class="k">With</div>
                <div>${others.map(escapeHtml).join(', ') || '&mdash;'}</div>
              </div>
            </div>
          </div>
        </div>
        <div class="room-card">
          <div class="front-marker">↑ Front of room</div>
          <div class="zone-grid" id="zoneGrid"></div>
        </div>
        <p class="mini-map-label">Room layout &middot; your group highlighted</p>
      `;

      const zoneGrid = document.getElementById('zoneGrid');
      for(let g = 1; g <= state.numGroups; g++){
        const box = document.createElement('div');
        box.className = 'zone-box' + (g === parseInt(groupNum,10) ? ' mine' : '');
        const groupMembers = state.groupAssignments[g] || [];
        box.innerHTML = `<div class="zone-label">Group ${g}</div><div class="zone-members">${groupMembers.map(escapeHtml).join(', ') || '&mdash;'}</div>`;
        zoneGrid.appendChild(box);
      }
    }
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ---------- PIN gate ----------
  function renderPinGate(){
    view.innerHTML = `

      <h1>Teacher setup</h1>
      <p class="sub">Enter the setup code to edit seating.</p>
      <div class="pin-box">

      });
      Object.keys(state.groupAssignments).forEach(g => {

      });
      showToast('Roster saved');
      render();
    });

        render();
      });

  function renderTeacherZoneGrid(){
    const grid = document.getElementById('teacherZoneGrid');
    if(!grid) return;
    grid.innerHTML = '';
    for(let g = 1; g <= state.numGroups; g++){
      const box = document.createElement('div');
      box.className = 'zone-box';
      const members = state.groupAssignments[g] || [];
      box.innerHTML = `<div class="zone-label">Group ${g}</div><div class="zone-members">${members.map(escapeHtml).join(', ') || '&mdash;'}</div>`;
      grid.appendChild(box);

  }

  function escapeAttr(str){
    return String(str).replace(/"/g, '&quot;');
  }

  function renderBoard(){
    const board = document.getElementById('board');
    if(!board) return;
    board.innerHTML = '';
    for(let r=0; r<state.rows; r++){
      for(let c=0; c<state.cols; c++){
        const key = seatKey(r,c);
        const cell = document.createElement('div');
        cell.dataset.key = key;
        const enabled = isEnabled(key);
        const name = state.assignments[key];
        cell.className = 'flap' + (enabled ? '' : ' gap') + (name ? ' assigned' : '');
        cell.innerHTML = `<div class="flap-inner" style="display:flex;flex-direction:column;align-items:center;">
            <span class="flap-code">${enabled ? key : '×'}</span>
            ${name ? `<span class="flap-name">${escapeHtml(name)}</span>` : ''}
          </div>`;
        cell.addEventListener('click', (e) => onCellClick(e, key));
        board.appendChild(cell);
      }
    }
  }

  function onCellClick(e, key){
    if(!isEnabled(key)){
      // toggle gap back into a seat
      state.seatEnabled[key] = true;
      renderBoard();
      return;
    }
    openAssignPopover(e.currentTarget, key);
  }

  function openAssignPopover(anchorEl, key){
    document.querySelectorAll('.assign-pop').forEach(p => p.remove());

    const rect = anchorEl.getBoundingClientRect();
    const pop = document.createElement('div');
    pop.className = 'assign-pop';
    const currentName = state.assignments[key];
    const unassigned = state.roster.filter(n => !Object.values(state.assignments).includes(n));

    let optionsHtml = '';
    if(currentName){
      optionsHtml += `<button class="pop-option clear" data-action="clear">Clear seat (${escapeHtml(currentName)})</button>`;
    }
    optionsHtml += `<button class="pop-option" data-action="markGap">Mark as gap / no seat</button>`;
    if(unassigned.length === 0){
      optionsHtml += `<div class="pop-empty">No unassigned students</div>`;
    } else {
      unassigned.forEach(n => {
        optionsHtml += `<button class="pop-option" data-action="assign" data-name="${escapeHtml(n)}">${escapeHtml(n)}</button>`;
      });
    }

    pop.innerHTML = `
      <div class="pop-title">
        <span>Seat ${key}</span>
        <button class="pop-close" aria-label="Close">✕</button>
      </div>
      ${optionsHtml}
    `;
    document.body.appendChild(pop);

    const top = Math.min(rect.bottom + 8, window.innerHeight - 280);
    const left = Math.min(rect.left, window.innerWidth - 236);
    pop.style.top = Math.max(top, 12) + 'px';
    pop.style.left = Math.max(left, 12) + 'px';

    pop.querySelector('.pop-close').addEventListener('click', () => pop.remove());
    pop.querySelectorAll('[data-action="assign"]').forEach(btn => {
      btn.addEventListener('click', () => {
        state.assignments[key] = btn.dataset.name;
        pop.remove();
        renderBoard();
        updateStatusLine();
      });
    });
    const clearBtn = pop.querySelector('[data-action="clear"]');
    if(clearBtn){
      clearBtn.addEventListener('click', () => {
        delete state.assignments[key];
        pop.remove();
        renderBoard();
        updateStatusLine();
      });
    }
    pop.querySelector('[data-action="markGap"]').addEventListener('click', () => {
      state.seatEnabled[key] = false;
      delete state.assignments[key];
      pop.remove();
      renderBoard();
      updateStatusLine();
    });

    setTimeout(() => {
      document.addEventListener('click', function outsideClick(ev){
        if(!pop.contains(ev.target) && ev.target !== anchorEl){
          pop.remove();
          document.removeEventListener('click', outsideClick);
        }
      });
    }, 0);
  }

  function updateStatusLine(){
    // Cheapest correct approach: re-render whole teacher view header stats without losing popovers open elsewhere.
    const enabledSeats = allSeatKeys().filter(isEnabled);
    const assignedCount = Object.keys(state.assignments).filter(k => isEnabled(k)).length;
    const unassignedNames = state.roster.filter(n => !Object.values(state.assignments).includes(n));
    const statusEls = document.querySelectorAll('.status-line');
    if(statusEls[1]){
      statusEls[1].innerHTML = `<b>${assignedCount}</b> of <b>${enabledSeats.length}</b> seats filled &middot; <b>${unassignedNames.length}</b> student${unassignedNames.length===1?'':'s'} unseated`;
    }
  }

  function runShuffleAnimation(){
    const board = document.getElementById('board');
    const cells = Array.from(board.querySelectorAll('.flap'));
    const enabledCells = cells.filter(c => isEnabled(c.dataset.key));

    const names = shuffleArray([...state.roster]);
    const finalAssignments = {};
    enabledCells.forEach((cell, i) => {
      if(names[i]) finalAssignments[cell.dataset.key] = names[i];
    });

    const decoyNames = state.roster.length ? state.roster : ['—'];
    let completed = 0;

    enabledCells.forEach((cell, i) => {
      const delay = i * 22;
      const flickerDuration = 420 + (i % 5) * 40;
      const startTime = Date.now();

      setTimeout(() => {
        const flickerInterval = setInterval(() => {
          cell.classList.add('flip');
          const nameSpan = cell.querySelector('.flap-name');
          const randomName = decoyNames[Math.floor(Math.random() * decoyNames.length)];
          if(nameSpan){
            nameSpan.textContent = randomName;
          } else {
            const span = document.createElement('span');
            span.className = 'flap-name';
            span.textContent = randomName;
            cell.querySelector('.flap-inner').appendChild(span);
          }
          setTimeout(() => cell.classList.remove('flip'), 160);

          if(Date.now() - startTime > flickerDuration){
            clearInterval(flickerInterval);
            const finalName = finalAssignments[cell.dataset.key];
            const span = cell.querySelector('.flap-name');
            if(finalName){
              cell.classList.add('assigned');
              if(span) span.textContent = finalName; else {
                const s = document.createElement('span');
                s.className = 'flap-name';
                s.textContent = finalName;
                cell.querySelector('.flap-inner').appendChild(s);
              }
            } else {
              cell.classList.remove('assigned');
              if(span) span.remove();
            }
            completed++;
            if(completed === enabledCells.length){
              state.assignments = finalAssignments;
              updateStatusLine();
            }
          }
        }, 90);
      }, delay);
    });
  }

  // ---------- Boot ----------
  async function boot(){
    view.innerHTML = `<p class="empty-note">Loading seating data...</p>`;
    await loadState();
    render();

    // light polling so students see updates without reloading
    setInterval(async () => {
      if(mode === 'student'){
        const prevAssignments = JSON.stringify(state.assignments);
        try{
          const result = await window.storage.get('seatcheck-config', true);
          if(result && result.value){
            const parsed = JSON.parse(result.value);
            state = Object.assign(state, parsed);
            ensureSeatDefaults();
            if(JSON.stringify(state.assignments) !== prevAssignments){
              refreshStudentResults();
            }
          }
        }catch(e){ /* ignore */ }
      }
    }, 8000);
  }

  boot();
})();
